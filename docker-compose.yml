name: observatory

# Core observability stack. Applications send OTLP to the collector:
#   gRPC  localhost:4317
#   HTTP  localhost:4318
# Heavy or optional components live behind compose profiles (see README).

x-restart: &restart
  restart: unless-stopped

services:
  otel-collector:
    <<: *restart
    image: otel/opentelemetry-collector-contrib:0.116.1
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./config/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - tempo
      - loki
      - prometheus
      - pyroscope

  prometheus:
    <<: *restart
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    volumes:
      - ./config/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  tempo:
    <<: *restart
    image: grafana/tempo:2.7.1
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./config/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"
    user: root

  loki:
    <<: *restart
    image: grafana/loki:3.3.2
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./config/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"

  pyroscope:
    <<: *restart
    image: grafana/pyroscope:1.11.0
    ports:
      - "4040:4040"
    volumes:
      - pyroscope-data:/data

  alertmanager:
    <<: *restart
    image: prom/alertmanager:v0.28.0
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./config/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "9093:9093"

  grafana:
    <<: *restart
    image: grafana/grafana:11.5.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor,metricsSummary
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - tempo
      - loki
      - pyroscope

  # Sample application used as the target for dashboards and load tests.
  demo-api:
    <<: *restart
    build: ./src/DemoApi
    environment:
      OTEL_SERVICE_NAME: demo-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_METRIC_EXPORT_INTERVAL: "5000"
    ports:
      - "18080:8080"
    depends_on:
      - otel-collector

  # Load generator. Run on demand:
  #   docker compose --profile loadtest run --rm k6 run /scripts/load.js
  k6:
    profiles: ["loadtest"]
    image: grafana/k6:0.57.0
    environment:
      BASE_URL: http://demo-api:8080
      K6_OUT: experimental-prometheus-rw
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_STATS: p(50),p(90),p(95),p(99),min,max,avg
      K6_PROMETHEUS_RW_PUSH_INTERVAL: 5s
    volumes:
      - ./k6:/scripts:ro
    depends_on:
      - demo-api
      - prometheus

volumes:
  prometheus-data:
  tempo-data:
  loki-data:
  pyroscope-data:
  alertmanager-data:
  grafana-data:
